      - name: Export integer-circle-degree import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_180617f5eedc10f191b736bc Hatcher.Sphere.DegreeLocalSum . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/integer-circle-degree-import-impact.json

      - name: Export suspension-degree import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_6335225854364397e3a20e8f Hatcher.Sphere.DegreeProperties . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/suspension-degree-import-impact.json

      - name: Upload proof review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formalize-evidence-${{ github.run_id }}
          path: .lake/formalize-evidence/artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
