# Builds the Lean project and validates its Autoform blueprint on neutral
# hardware. Actions and the Autoform source are pinned immutably.

name: autoform verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      article_id:
        description: Article whose candidate needs proof evidence
        default: af_199be8e09b149f1f0bc4e775
        required: true
      module:
        description: Lean module containing the candidate
        default: Hatcher.Sphere.Homology
        required: true
      declaration:
        description: Candidate declaration to inspect
        default: Hatcher.Sphere.sphere_suspension_boundary_naturality
        required: true

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"
  EVIDENCE_ARTICLE: ${{ inputs.article_id || 'af_199be8e09b149f1f0bc4e775' }}
  EVIDENCE_MODULE: ${{ inputs.module || 'Hatcher.Sphere.Homology' }}
  EVIDENCE_DECLARATION: ${{ inputs.declaration || 'Hatcher.Sphere.sphere_suspension_boundary_naturality' }}

concurrency:
  group: autoform-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read the Autoform pin
        run: echo "AUTOFORM_REF=$(cat .github/autoform-ref)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Validate the theorem DAG
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

      - name: Validate source-unit provenance
        run: python3 scripts/check_source_units.py blueprint

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject kernel-check bypass options
        run: |
          set -euo pipefail
          # Scan all tracked text, including Lake configuration. Keep the
          # forbidden token split so this checker does not match itself.
          forbidden="skip""KernelTC"
          if matches="$(git grep -n -I "$forbidden" -- .)"; then
            printf 'Kernel-check bypass option found:\n%s\n' "$matches" >&2
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "failed to scan tracked files" >&2
              exit "$grep_status"
            fi
          fi
          echo "no kernel-check bypass option found"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get || echo "no cache available — building from source"

      - name: Build the focused proof module
        run: >-
          lake build "$EVIDENCE_MODULE"
          Hatcher.Sphere.CirclePower Hatcher.Sphere.LocalDegree
          Hatcher.Sphere.PuncturedStereographic
          Hatcher.Singular.PointQuotientTopology
          Hatcher.VanKampen.ConeAttachmentDisk
          Hatcher.Singular.PointedWedgePointQuotient
          Hatcher.Sphere.HomeomorphismLocalDegree Hatcher.Sphere.DegreeLocalSum

      - name: Build Lean
        run: lake build

      - name: Audit every project declaration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          modules = []
          for path in sorted(pathlib.Path(".").rglob("*.lean")):
              if (
                  ".lake" in path.parts
                  or path.name.startswith("lakefile")
                  or path.name == "autoform_axiom_probe.lean"
              ):
                  continue
              modules.append(".".join(path.with_suffix("").parts))
          if not modules:
              print("no Lean modules to audit")
              sys.exit(0)

          modules = list(dict.fromkeys(modules))
          imports = "\n".join(f"import {module}" for module in modules)

          def lean_name(module):
              result = "Name.anonymous"
              for part in module.split("."):
                  result = f"Name.str ({result}) {json.dumps(part)}"
              return result

          target_modules = ", ".join(lean_name(module) for module in modules)
          probe = imports + "\nimport Lean.Util.CollectAxioms\nimport Lean.Elab.Command\n\n" + f'''\
          open Lean Elab Command

          run_cmd do
            let targetModules : List Name := [{target_modules}]
            let allowed : List Name := [``propext, ``Classical.choice, ``Quot.sound]
            let env ← getEnv
            let mut checked : Nat := 0
            let mut badSafety : Array Name := #[]
            let mut badAxioms : Array (Name × Name) := #[]
            for (declName, info) in env.constants do
              if let some moduleIdx := env.getModuleIdxFor? declName then
                let moduleName := env.header.moduleNames[moduleIdx.toNat]!
                if targetModules.contains moduleName then
                  checked := checked + 1
                  if info.isUnsafe || info.isPartial then
                    badSafety := badSafety.push declName
                  for usedAxiom in (← Lean.collectAxioms declName) do
                    unless allowed.contains usedAxiom do
                      badAxioms := badAxioms.push (declName, usedAxiom)
            for declName in badSafety do
              logError m!"unsafe or partial declaration: {{declName}}"
            for (declName, usedAxiom) in badAxioms do
              logError m!"{{declName}} depends on unexpected axiom {{usedAxiom}}"
            unless badSafety.isEmpty && badAxioms.isEmpty do
              throwError "project declarations failed the kernel-trust audit"
            logInfo m!"kernel trust clean ({{checked}} project declaration(s) audited)"
          '''
          pathlib.Path("autoform_axiom_probe.lean").write_text(probe, encoding="utf-8")

          result = subprocess.run(
              ["lake", "env", "lean", "autoform_axiom_probe.lean"],
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              sys.exit("axiom probe failed to elaborate")
          PY

      - name: Export proof review evidence
        run: |
          python3 scripts/formalize_evidence.py \
            --article-id "$EVIDENCE_ARTICLE" \
            --module "$EVIDENCE_MODULE" \
            --declaration "$EVIDENCE_DECLARATION" \
            --declaration Hatcher.Sphere.sphereConeGoodPair \
            --declaration Hatcher.Sphere.sphereSuspensionBoundaryIso \
            --declaration Hatcher.Sphere.sphere_suspension_boundary_iso_hom

      - name: Export quotient import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_7b75fc9548f3d4af72397bf9 Hatcher.Singular.PointQuotientTopology . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/quotient-import-impact.json

      - name: Check the combined formalization frontier
        run: |
          set -euo pipefail
          cat > .lake/formalize-evidence/FrontierChecks.lean <<'LEAN'
          import Hatcher.Sphere.CirclePower
          import Hatcher.Sphere.LocalDegree
          import Hatcher.Sphere.PuncturedStereographic
          import Hatcher.Singular.PointQuotientTopology
          import Hatcher.VanKampen.ConeAttachmentDisk
          import Hatcher.Singular.PointedWedgePointQuotient
          import Hatcher.Sphere.HomeomorphismLocalDegree
          import Hatcher.Sphere.DegreeLocalSum
          import Batteries.Tactic.Lint

          #print axioms Hatcher.Sphere.circlePowerMap_positive_arcChart
          #print axioms Hatcher.Sphere.circlePowerMap_positive_localStretchDeformation
          #print axioms Hatcher.Sphere.localDegree_punctured_homotopy_invariance
          #print axioms Hatcher.Sphere.finite_disjoint_sphere_balls
          #print axioms Hatcher.Relative.compactComplementQuotientOnePointHomeomorph
          #print axioms Hatcher.Relative.compactComplementQuotientOnePointHomeomorph_apply_point
          #print axioms Hatcher.Relative.compactComplementQuotientOnePointHomeomorph_apply_projection
          #print axioms Hatcher.Sphere.sphere_cone_geometry
          #print axioms Hatcher.Sphere.sphereCone
          #print axioms Hatcher.Sphere.sphereConeBase
          #print axioms Hatcher.Sphere.sphereConePair
          #print axioms Hatcher.Sphere.sphereConeGoodPairData
          #print axioms Hatcher.Sphere.sphereConePairMap
          #print axioms Hatcher.Sphere.sphereConeMap
          #print axioms Hatcher.Sphere.sphere_cone_map_base
          #print axioms Hatcher.Sphere.sphere_cone_map_apex
          #print axioms Hatcher.Sphere.sphere_cone_map_cylinder
          #print axioms Hatcher.Sphere.sphere_cone_map_base_square
          #print axioms Hatcher.Sphere.sphere_cone_pair_map_fst
          #print axioms Hatcher.Sphere.sphere_cone_pair_map_snd
          #print axioms Hatcher.Sphere.sphere_cone_pair_map_id
          #print axioms Hatcher.Sphere.sphere_cone_pair_map_comp
          #print axioms Hatcher.Relative.finiteOnePointSigmaWedgeHomeomorph
          #print axioms Hatcher.Relative.finite_one_point_sigma_wedge_homeomorph_apply_coe
          #print axioms Hatcher.Relative.finite_one_point_sigma_wedge_homeomorph_apply_infty
          #print axioms Hatcher.Sphere.sphereConeQuotientHomeomorph
          #print axioms Hatcher.Sphere.sphereConeCylinderPoint
          #print axioms Hatcher.Sphere.sphere_cone_cylinder_point_coordinates
          #print axioms Hatcher.Sphere.sphereConeQuotientMap
          #print axioms Hatcher.Sphere.sphere_cone_quotient_homeomorph_point
          #print axioms Hatcher.Sphere.sphere_cone_quotient_homeomorph_base
          #print axioms Hatcher.Sphere.sphere_cone_quotient_homeomorph_apex
          #print axioms Hatcher.Sphere.sphere_cone_quotient_homeomorph_cylinder
          #print axioms Hatcher.Sphere.sphere_cone_quotient_homeomorph_coordinates
          #print axioms Hatcher.Sphere.circlePowerMap_positive_localDegree
          #print axioms Hatcher.Sphere.circlePowerMap_positive_degree
          #print axioms Hatcher.Sphere.sphereSuspensionMap
          #print axioms Hatcher.Sphere.sphereSuspensionProjection
          #print axioms Hatcher.Sphere.sphere_suspension_map_quotient
          #print axioms Hatcher.Sphere.sphere_suspension_map_ambient_naturality
          #print axioms Hatcher.Sphere.sphere_suspension_map_cylinder
          #print axioms Hatcher.Sphere.sphere_suspension_map_north_pole
          #print axioms Hatcher.Sphere.sphere_suspension_map_south_pole
          #print axioms Hatcher.Sphere.sphere_suspension_map_id
          #print axioms Hatcher.Sphere.sphere_suspension_map_comp

          #lint only unusedArguments in Hatcher.Sphere.CirclePower
          #lint only unusedArguments in Hatcher.Sphere.LocalDegree
          #lint only unusedArguments in Hatcher.Sphere.PuncturedStereographic
          #lint only unusedArguments in Hatcher.Singular.PointQuotientTopology
          #lint only unusedArguments in Hatcher.VanKampen.ConeAttachmentDisk
          #lint only unusedArguments in Hatcher.Singular.PointedWedgePointQuotient
          #lint only unusedArguments in Hatcher.Sphere.HomeomorphismLocalDegree
          #lint only unusedArguments in Hatcher.Sphere.DegreeLocalSum
          LEAN
          lake env lean .lake/formalize-evidence/FrontierChecks.lean \
            | tee .lake/formalize-evidence/artifacts/frontier-axioms-and-lint.txt

      - name: Export local-degree import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_b27bb3e374b92a7334095698 Hatcher.Sphere.LocalDegree . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/local-degree-import-impact.json

      - name: Export cone import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_94410cbcc0ca4ddd482ec0f6 Hatcher.VanKampen.ConeAttachmentDisk . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/cone-import-impact.json

      - name: Export finite-wedge import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_f0ce52bed8b3559c75b76fa3 Hatcher.Singular.PointedWedgePointQuotient . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/wedge-import-impact.json

      - name: Export positive-local-degree import baseline
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_7f28a7505a467328c2236288 Hatcher.Sphere.HomeomorphismLocalDegree . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/positive-local-degree-import-impact-baseline.json

      - name: Export finite-wedge import baseline
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_f0ce52bed8b3559c75b76fa3 Hatcher.Singular.PointedWedgePointQuotient . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/wedge-import-impact-baseline.json

      - name: Export cone-quotient import baseline
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_3bee065ead7f165534b9f450 Hatcher.VanKampen.ConeAttachmentDisk . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/cone-quotient-import-impact-baseline.json

      - name: Export cone-quotient import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_3bee065ead7f165534b9f450 Hatcher.VanKampen.ConeAttachmentDisk . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/cone-quotient-import-impact.json

      - name: Export positive-local-degree import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_7f28a7505a467328c2236288 Hatcher.Sphere.HomeomorphismLocalDegree . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/positive-local-degree-import-impact.json

      - name: Export positive-global-degree import baseline
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_641bb17f8f6aeb2a33fabd0d Hatcher.Sphere.DegreeLocalSum . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/positive-global-degree-import-impact-baseline.json

      - name: Export sphere-pinch import baseline
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_94c9b10f3bfd64e882b0e386 Hatcher.Sphere.PuncturedStereographic . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/sphere-pinch-import-impact-baseline.json

      - name: Export positive-global-degree import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_641bb17f8f6aeb2a33fabd0d Hatcher.Sphere.DegreeLocalSum . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/positive-global-degree-import-impact.json

      - name: Export integer-circle-degree import baseline
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_180617f5eedc10f191b736bc Hatcher.Sphere.DegreeLocalSum . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/integer-circle-degree-import-impact-baseline.json

      - name: Export suspension-boundary import baseline
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_199be8e09b149f1f0bc4e775 Hatcher.Sphere.Homology . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/suspension-boundary-import-impact-baseline.json

      - name: Export suspension-boundary import impact
        run: |
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}" \
            autoform work import-impact \
            af_199be8e09b149f1f0bc4e775 Hatcher.Sphere.Homology . \
            --lean-root . --json \
            > .lake/formalize-evidence/artifacts/suspension-boundary-import-impact.json

      - name: Upload proof review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formalize-evidence-${{ github.run_id }}
          path: .lake/formalize-evidence/artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
