name: Blueprint Pages

on:
  push:
    branches: [main]
    paths:
      - "blueprint/**"
      - "**.lean"
      - "mkdocs.yml"
      - "scripts/blueprint_nav.py"
      - "scripts/check_source_units.py"
      - "tests/test_blueprint_nav.py"
      - ".github/autoform-ref"
      - ".github/workflows/blueprint-pages.yml"
  pull_request:
    paths:
      - "blueprint/**"
      - "**.lean"
      - "mkdocs.yml"
      - "scripts/blueprint_nav.py"
      - "scripts/check_source_units.py"
      - "tests/test_blueprint_nav.py"
      - ".github/autoform-ref"
      - ".github/workflows/blueprint-pages.yml"
  workflow_dispatch:
    inputs:
      newest:
        description: Try autoform-bot's newest main commit
        type: boolean
        default: false
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

env:
  AUTOFORM_SOURCE: "https://github.com/facebookresearch/autoform-bot.git"

# One queue per ref: with the Lean build a run takes minutes, and a pull
# request's run waiting in main's queue would replace a waiting deploy.
concurrency:
  group: blueprint-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The site builds with the Autoform commit in .github/autoform-ref. The daily
  # run, or a run started with "newest", tries autoform-bot's newest main commit
  # instead, and the pin job records it once the site builds. A commit that
  # fails leaves the pin and the published site as they were.
  pick:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      new: ${{ steps.pick.outputs.new }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the Autoform commit
        id: pick
        env:
          NEWEST: ${{ github.event_name == 'schedule' || inputs.newest }}
        run: |
          ref="$(cat .github/autoform-ref)"
          if [ "$NEWEST" = true ]; then
            newest="$(git ls-remote "$AUTOFORM_SOURCE" refs/heads/main | cut -f1)"
            if [ "$newest" != "$ref" ]; then
              ref="$newest"
              echo "new=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    needs: pick
    # A daily run with nothing new to try builds nothing.
    if: github.event_name != 'schedule' || needs.pick.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      AUTOFORM_REF: ${{ needs.pick.outputs.ref }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      # Rejects cycles and dangling links, and fails when a node names a Lean
      # declaration that is not in the sources.
      - name: Validate the theorem DAG and its declarations
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform check blueprint --lean-root .

      - name: Validate source-unit provenance
        run: python3 scripts/check_source_units.py blueprint

      - name: Audit the roadmap (report only)
        continue-on-error: true
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform audit blueprint --lean-root .

      # Records the declaration Lean resolved each name in the sources to, in
      # .lake/build/lib/lean's .ilean files, which render reads to link each
      # name in a statement's Lean exactly. If Mathlib's cache or the build
      # fails, render links names as before, and the deploy goes ahead.
      - name: Build Lean
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build

      # Writes site-src/: statement boxes, derived statuses, the Mermaid graph,
      # and permalinks into the Lean code at this exact commit.
      - name: Render the blueprint
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform render blueprint
          --output site-src
          --lean-root .
          --require-declarations
          --ileans .lake/build/lib/lean
          --ref "${GITHUB_SHA}"

      - name: Test generated book navigation
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.7.7
          --with mkdocs-literate-nav==0.6.2
          --with markdown==3.10.3
          --with pymdown-extensions==11.0.1
          python -m unittest discover -s tests -p test_blueprint_nav.py

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with mkdocs-material==9.7.7
          --with mkdocs-literate-nav==0.6.2
          --with markdown==3.10.3
          --with pymdown-extensions==11.0.1
          mkdocs build --strict

      # Lists internal links and anchors that lead nowhere, which `--strict`
      # never checks in render's raw HTML, and statement cards the build
      # dropped. It never fails the build or stops a deploy.
      - name: Check the built site (report only)
        continue-on-error: true
        run: >-
          uvx --from "git+${AUTOFORM_SOURCE}@${AUTOFORM_REF}"
          autoform site check site --source site-src

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pin:
    needs: [pick, build]
    if: needs.pick.outputs.new == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A push made with this token starts no workflow, so this commit does not
      # rebuild the site it records.
      - name: Pin the Autoform commit the site was built with
        env:
          REF: ${{ needs.pick.outputs.ref }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          echo "$REF" > .github/autoform-ref
          git commit --quiet -m "Build the site with Autoform ${REF:0:8}" .github/autoform-ref
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
